<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"><style>
  .s{fill:var(--surface)}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ti{fill:var(--ink);font-size:17px;font-weight:600}
  .sub{fill:var(--ink2);font-size:12.5px}
  .ax{fill:var(--ink2);font-size:11.5px}
  .axt{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .grid{stroke:var(--rule);stroke-width:1}
  .base{stroke:var(--rule2);stroke-width:1.5}
  .lab{font-size:12.5px;font-weight:600}
  .note{fill:var(--ink2);font-size:11px}
  .c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
  .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsh{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .txt{fill:var(--c)}
  .bar{fill:var(--s1)}
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--rule:#e7e6e2;--rule2:#c9c8c2;
        --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
  @media (prefers-color-scheme:dark){:root{
        --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--rule:#2e2e2c;--rule2:#4a4a46;
        --s1:#3987e5;--s2:#d95926;--s3:#199e70}}
</style><rect width="880" height="470" class="s"/><text x="74" y="26" class="ti">A third of the collateral is a staking-yield derivative</text><text x="74" y="45" class="sub">wstETH and weETH as a share of total value locked, three largest Ethereum lending markets.</text><line x1="170.0" y1="62" x2="170.0" y2="310" class="grid"/><text x="170.0" y="328" class="ax" text-anchor="middle">0%</text><line x1="340.0" y1="62" x2="340.0" y2="310" class="grid"/><text x="340.0" y="328" class="ax" text-anchor="middle">25%</text><line x1="510.0" y1="62" x2="510.0" y2="310" class="grid"/><text x="510.0" y="328" class="ax" text-anchor="middle">50%</text><line x1="680.0" y1="62" x2="680.0" y2="310" class="grid"/><text x="680.0" y="328" class="ax" text-anchor="middle">75%</text><line x1="850.0" y1="62" x2="850.0" y2="310" class="grid"/><text x="850.0" y="328" class="ax" text-anchor="middle">100%</text><text x="510" y="350" class="axt" text-anchor="middle">Share of protocol TVL held as liquid-staking tokens</text><text x="158" y="94" class="lab" text-anchor="end" fill="var(--ink)">SparkLend</text><rect x="170.0" y="72" width="680.0" height="34" rx="4" fill="var(--rule)"/><rect x="170.0" y="72" width="466.3" height="34" rx="4" fill="var(--s1)"/><text x="646.3" y="94" class="lab" fill="var(--ink)">68.6%</text><text x="694.3" y="94" class="note">$2.45B of $3.57B</text><text x="158" y="156" class="lab" text-anchor="end" fill="var(--ink)">Aave V3</text><rect x="170.0" y="134" width="680.0" height="34" rx="4" fill="var(--rule)"/><rect x="170.0" y="134" width="238.2" height="34" rx="4" fill="var(--s1)"/><text x="418.2" y="156" class="lab" fill="var(--ink)">35.0%</text><text x="466.2" y="156" class="note">$4.97B of $14.19B</text><text x="158" y="218" class="lab" text-anchor="end" fill="var(--ink)">Morpho Blue</text><rect x="170.0" y="196" width="680.0" height="34" rx="4" fill="var(--rule)"/><rect x="170.0" y="196" width="69.0" height="34" rx="4" fill="var(--s1)"/><text x="249.0" y="218" class="lab" fill="var(--ink)">10.1%</text><text x="297.0" y="218" class="note">$0.81B of $7.97B</text><text x="158" y="280" class="lab" text-anchor="end" fill="var(--ink)">All three</text><rect x="170.0" y="258" width="680.0" height="34" rx="4" fill="var(--rule)"/><rect x="170.0" y="258" width="217.5" height="34" rx="4" fill="var(--s3)"/><text x="397.5" y="280" class="lab" fill="var(--ink)">32.0%</text><text x="445.5" y="280" class="note">$8.23B of $25.73B</text><text x="74" y="440" class="note">Exposure is not the same as dependency: wstETH still dominates plain WETH as collateral at any positive yield. What breaks at a lower yield is the levered</text><text x="74" y="454" class="note">staking loop, which needs the staking yield to exceed the ETH borrow rate. Lido alone is 43% of all Ethereum DeFi TVL.</text></svg>