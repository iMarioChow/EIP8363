<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"><style>
  .s{fill:var(--surface)}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ti{fill:var(--ink);font-size:17px;font-weight:600}
  .sub{fill:var(--ink2);font-size:12.5px}
  .ax{fill:var(--ink2);font-size:11.5px}
  .axt{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .grid{stroke:var(--rule);stroke-width:1}
  .base{stroke:var(--rule2);stroke-width:1.5}
  .lab{font-size:12.5px;font-weight:600}
  .note{fill:var(--ink2);font-size:11px}
  .c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
  .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsh{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .txt{fill:var(--c)}
  .bar{fill:var(--s1)}
  .bar2{fill:var(--s2)} .bar3{fill:var(--s3)}
  .pt{fill:var(--c);fill-opacity:.55;stroke:none}
  .band{fill:var(--c);fill-opacity:.14;stroke:none}
  .fit{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round}
  .zero{stroke:var(--rule2);stroke-width:1.2;stroke-dasharray:4 4}
  .area{fill:var(--c);fill-opacity:.22;stroke:none}
  .box{fill:var(--surface);stroke:var(--rule2);stroke-width:1;rx:5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink2)}
  .monob{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink);font-weight:600}
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--rule:#e7e6e2;--rule2:#c9c8c2;
        --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
  @media (prefers-color-scheme:dark){:root{
        --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--rule:#2e2e2c;--rule2:#4a4a46;
        --s1:#3987e5;--s2:#d95926;--s3:#199e70}}
</style><rect width="880" height="470" class="s"/><text x="84" y="26" class="ti">Issuance now dwarfs the burn</text><text x="84" y="45" class="sub">Consensus-layer issuance against EIP-1559 burn, ETH per calendar year. Post-Merge only: before Sep 2022 most issuance was proof-of-work.</text><line x1="84" y1="404.0" x2="850" y2="404.0" class="grid"/><text x="74" y="408.0" class="ax" text-anchor="end">0k</text><line x1="84" y1="327.1" x2="850" y2="327.1" class="grid"/><text x="74" y="331.1" class="ax" text-anchor="end">300k</text><line x1="84" y1="250.2" x2="850" y2="250.2" class="grid"/><text x="74" y="254.2" class="ax" text-anchor="end">600k</text><line x1="84" y1="173.3" x2="850" y2="173.3" class="grid"/><text x="74" y="177.3" class="ax" text-anchor="end">900k</text><line x1="84" y1="96.4" x2="850" y2="96.4" class="grid"/><text x="74" y="100.4" class="ax" text-anchor="end">1,200k</text><rect x="126.0" y="201.7" width="49.8" height="202.3" rx="3" class="bar"/><text x="150.9" y="193.7" class="ax" text-anchor="middle">789k</text><rect x="183.7" y="123.7" width="49.8" height="280.3" rx="3" class="bar2"/><text x="208.6" y="115.7" class="ax" text-anchor="middle">1,094k</text><text x="179.8" y="95.7" class="lab" text-anchor="middle" fill="var(--ink)">-304k net</text><text x="179.8" y="424.0" class="ax" text-anchor="middle">2023</text><rect x="317.5" y="159.5" width="49.8" height="244.5" rx="3" class="bar"/><text x="342.4" y="151.5" class="ax" text-anchor="middle">954k</text><rect x="375.2" y="241.4" width="49.8" height="162.6" rx="3" class="bar2"/><text x="400.1" y="233.4" class="ax" text-anchor="middle">634k</text><text x="371.2" y="131.5" class="lab" text-anchor="middle" fill="var(--ink)">+320k net</text><text x="371.2" y="424.0" class="ax" text-anchor="middle">2024</text><rect x="509.0" y="149.8" width="49.8" height="254.2" rx="3" class="bar"/><text x="533.9" y="141.8" class="ax" text-anchor="middle">992k</text><rect x="566.7" y="380.6" width="49.8" height="23.4" rx="3" class="bar2"/><text x="591.6" y="372.6" class="ax" text-anchor="middle">91k</text><text x="562.8" y="121.8" class="lab" text-anchor="middle" fill="var(--ink)">+901k net</text><text x="562.8" y="424.0" class="ax" text-anchor="middle">2025</text><rect x="700.5" y="243.9" width="49.8" height="160.1" rx="3" class="bar"/><text x="725.4" y="235.9" class="ax" text-anchor="middle">625k</text><rect x="758.2" y="400.8" width="49.8" height="3.2" rx="3" class="bar2"/><text x="783.1" y="392.8" class="ax" text-anchor="middle">13k</text><text x="754.2" y="215.9" class="lab" text-anchor="middle" fill="var(--ink)">+612k net</text><text x="754.2" y="424.0" class="ax" text-anchor="middle">2026</text><text x="754.2" y="438.0" class="ax" text-anchor="middle">YTD</text><text transform="rotate(-90 150.9 388.0)" x="150.9" y="388.0" class="lab" text-anchor="start" fill="var(--surface)">Issuance</text><text transform="rotate(-90 208.6 388.0)" x="208.6" y="388.0" class="lab" text-anchor="start" fill="var(--surface)">Burn</text><text x="467" y="452" class="axt" text-anchor="middle">Calendar year</text><text transform="rotate(-90 20 231.0)" x="20" y="231.0" class="axt" text-anchor="middle">ETH per year</text><text x="84" y="466" class="note">2023 was the last year the burn exceeded issuance. Since then the gap has widened every year, and in 2026 the burn offsets under 2% of what the</text><text x="84" y="480" class="note">protocol issues — which is the fact EIP-8363 is a response to. 2026 covers 1 Jan to 31 Jul on both series.</text><line x1="84" y1="404.0" x2="850" y2="404.0" class="base"/></svg>