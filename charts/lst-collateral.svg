<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"><style>
  .s{fill:var(--surface)}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ti{fill:var(--ink);font-size:17px;font-weight:600}
  .sub{fill:var(--ink2);font-size:12.5px}
  .ax{fill:var(--ink2);font-size:11.5px}
  .axt{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .grid{stroke:var(--rule);stroke-width:1}
  .base{stroke:var(--rule2);stroke-width:1.5}
  .lab{font-size:12.5px;font-weight:600}
  .note{fill:var(--ink2);font-size:11px}
  .c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
  .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsh{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .txt{fill:var(--c)}
  .bar{fill:var(--s1)}
  .bar2{fill:var(--s2)} .bar3{fill:var(--s3)}
  .pt{fill:var(--c);fill-opacity:.55;stroke:none}
  .band{fill:var(--c);fill-opacity:.14;stroke:none}
  .fit{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round}
  .zero{stroke:var(--rule2);stroke-width:1.2;stroke-dasharray:4 4}
  .area{fill:var(--c);fill-opacity:.22;stroke:none}
  .box{fill:var(--surface);stroke:var(--rule2);stroke-width:1;rx:5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink2)}
  .monob{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink);font-weight:600}
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--rule:#e7e6e2;--rule2:#c9c8c2;
        --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
  @media (prefers-color-scheme:dark){:root{
        --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--rule:#2e2e2c;--rule2:#4a4a46;
        --s1:#3987e5;--s2:#d95926;--s3:#199e70}}
</style><rect width="880" height="470" class="s"/><text x="84" y="26" class="ti">A third of major lending collateral is a staking-yield derivative</text><text x="84" y="45" class="sub">wstETH and weETH as a share of each lending market's total TVL. Exposure, not dependency — but SparkLend is a single-asset book.</text><line x1="84" y1="404.0" x2="850" y2="404.0" class="grid"/><text x="74" y="408.0" class="ax" text-anchor="end">0%</text><line x1="84" y1="334.8" x2="850" y2="334.8" class="grid"/><text x="74" y="338.8" class="ax" text-anchor="end">15%</text><line x1="84" y1="265.6" x2="850" y2="265.6" class="grid"/><text x="74" y="269.6" class="ax" text-anchor="end">30%</text><line x1="84" y1="196.4" x2="850" y2="196.4" class="grid"/><text x="74" y="200.4" class="ax" text-anchor="end">45%</text><line x1="84" y1="127.2" x2="850" y2="127.2" class="grid"/><text x="74" y="131.2" class="ax" text-anchor="end">60%</text><line x1="84" y1="58.0" x2="850" y2="58.0" class="grid"/><text x="74" y="62.0" class="ax" text-anchor="end">75%</text><rect x="168.3" y="97.7" width="86.8" height="306.3" rx="3" class="bar"/><text x="211.7" y="254.9" class="lab" text-anchor="middle" fill="var(--surface)">wstETH 66%</text><rect x="168.3" y="87.4" width="86.8" height="10.3" rx="3" class="bar2"/><text x="211.7" y="77.4" class="lab" text-anchor="middle" fill="var(--ink)">68.6%</text><text x="211.7" y="424.0" class="ax" text-anchor="middle">SparkLend</text><text x="211.7" y="439.0" class="note" text-anchor="middle">$3.57B TVL</text><rect x="423.6" y="324.0" width="86.8" height="80.0" rx="3" class="bar"/><text x="467.0" y="368.0" class="lab" text-anchor="middle" fill="var(--surface)">wstETH 17%</text><rect x="423.6" y="242.4" width="86.8" height="81.6" rx="3" class="bar2"/><text x="467.0" y="287.2" class="lab" text-anchor="middle" fill="var(--surface)">weETH 18%</text><text x="467.0" y="232.4" class="lab" text-anchor="middle" fill="var(--ink)">35.0%</text><text x="467.0" y="424.0" class="ax" text-anchor="middle">Aave V3</text><text x="467.0" y="439.0" class="note" text-anchor="middle">$14.19B TVL</text><rect x="678.9" y="371.6" width="86.8" height="32.4" rx="3" class="bar"/><text x="722.3" y="391.8" class="lab" text-anchor="middle" fill="var(--surface)">wstETH 7%</text><rect x="678.9" y="357.1" width="86.8" height="14.5" rx="3" class="bar2"/><text x="722.3" y="347.1" class="lab" text-anchor="middle" fill="var(--ink)">10.2%</text><text x="722.3" y="424.0" class="ax" text-anchor="middle">Morpho Blue</text><text x="722.3" y="439.0" class="note" text-anchor="middle">$7.97B TVL</text><text x="467" y="458" class="axt" text-anchor="middle">Lending market</text><text transform="rotate(-90 20 231.0)" x="20" y="231.0" class="axt" text-anchor="middle">LST collateral (% of protocol TVL)</text><text x="84" y="472" class="note">~$8.2B of ~$25.7B of collateral across the three largest Ethereum lending markets is tokenised staked ETH. What breaks at a lower yield is the</text><text x="84" y="486" class="note">leveraged staking loop, not the collateral itself.</text><line x1="84" y1="404.0" x2="850" y2="404.0" class="base"/></svg>