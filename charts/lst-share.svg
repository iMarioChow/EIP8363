<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"><style>
  .s{fill:var(--surface)}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ti{fill:var(--ink);font-size:17px;font-weight:600}
  .sub{fill:var(--ink2);font-size:12.5px}
  .ax{fill:var(--ink2);font-size:11.5px}
  .axt{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .grid{stroke:var(--rule);stroke-width:1}
  .base{stroke:var(--rule2);stroke-width:1.5}
  .lab{font-size:12.5px;font-weight:600}
  .note{fill:var(--ink2);font-size:11px}
  .c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
  .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsh{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .txt{fill:var(--c)}
  .bar{fill:var(--s1)}
  .bar2{fill:var(--s2)} .bar3{fill:var(--s3)}
  .pt{fill:var(--c);fill-opacity:.55;stroke:none}
  .band{fill:var(--c);fill-opacity:.14;stroke:none}
  .fit{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round}
  .zero{stroke:var(--rule2);stroke-width:1.2;stroke-dasharray:4 4}
  .area{fill:var(--c);fill-opacity:.22;stroke:none}
  .box{fill:var(--surface);stroke:var(--rule2);stroke-width:1;rx:5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink2)}
  .monob{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink);font-weight:600}
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--rule:#e7e6e2;--rule2:#c9c8c2;
        --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
  @media (prefers-color-scheme:dark){:root{
        --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--rule:#2e2e2c;--rule2:#4a4a46;
        --s1:#3987e5;--s2:#d95926;--s3:#199e70}}
</style><rect width="880" height="470" class="s"/><text x="84" y="26" class="ti">One protocol intermediates a fifth of all staked ETH</text><text x="84" y="45" class="sub">Share of the 41.9M staked ETH ($79.4B) by custody route. Lido alone is 43% of Ethereum's entire $41.3B DeFi TVL.</text><line x1="210.0" y1="58" x2="210.0" y2="404" class="grid"/><text x="210.0" y="424.0" class="ax" text-anchor="middle">0%</text><line x1="291.3" y1="58" x2="291.3" y2="404" class="grid"/><text x="291.3" y="424.0" class="ax" text-anchor="middle">10%</text><line x1="372.7" y1="58" x2="372.7" y2="404" class="grid"/><text x="372.7" y="424.0" class="ax" text-anchor="middle">20%</text><line x1="454.0" y1="58" x2="454.0" y2="404" class="grid"/><text x="454.0" y="424.0" class="ax" text-anchor="middle">30%</text><line x1="535.3" y1="58" x2="535.3" y2="404" class="grid"/><text x="535.3" y="424.0" class="ax" text-anchor="middle">40%</text><line x1="616.7" y1="58" x2="616.7" y2="404" class="grid"/><text x="616.7" y="424.0" class="ax" text-anchor="middle">50%</text><line x1="698.0" y1="58" x2="698.0" y2="404" class="grid"/><text x="698.0" y="424.0" class="ax" text-anchor="middle">60%</text><line x1="779.3" y1="58" x2="779.3" y2="404" class="grid"/><text x="779.3" y="424.0" class="ax" text-anchor="middle">70%</text><rect x="210" y="71.8" width="183.8" height="30.0" rx="3" class="bar"/><text x="402.8" y="90.8" class="lab" fill="var(--ink)">22.6%  ·  $17.94B</text><text x="198" y="90.8" class="ax" text-anchor="end">Lido (stETH)</text><rect x="210" y="129.5" width="72.4" height="30.0" rx="3" class="bar"/><text x="291.4" y="148.5" class="lab" fill="var(--ink)">8.9%  ·  $7.04B</text><text x="198" y="148.5" class="ax" text-anchor="end">Binance staked ETH</text><rect x="210" y="187.2" width="34.2" height="30.0" rx="3" class="bar"/><text x="253.2" y="206.2" class="lab" fill="var(--ink)">4.2%  ·  $3.31B</text><text x="198" y="206.2" class="ax" text-anchor="end">ether.fi (weETH)</text><rect x="210" y="244.8" width="10.6" height="30.0" rx="3" class="bar"/><text x="229.6" y="263.8" class="lab" fill="var(--ink)">1.3%  ·  $1.00B</text><text x="198" y="263.8" class="ax" text-anchor="end">Rocket Pool (rETH)</text><rect x="210" y="302.5" width="3.3" height="30.0" rx="3" class="bar"/><text x="222.3" y="321.5" class="lab" fill="var(--ink)">0.4%  ·  $0.35B</text><text x="198" y="321.5" class="ax" text-anchor="end">Coinbase (cbETH)</text><rect x="210" y="360.2" width="510.0" height="30.0" rx="3" class="bar3"/><text x="729.0" y="379.2" class="lab" fill="var(--ink)">62.7%  ·  $49.76B</text><text x="198" y="379.2" class="ax" text-anchor="end">Solo, CEX and other custody</text><text x="515" y="448" class="axt" text-anchor="middle">Share of all staked ETH (%)</text><text transform="rotate(-90 20 231.0)" x="20" y="231.0" class="axt" text-anchor="middle">Custody route</text><text x="20" y="466" class="note">DefiLlama TVL, 13 Aug 2026. The top five liquid-staking routes are 37.3% of staked ETH; the rest is solo validators, exchanges and institutional</text><text x="20" y="480" class="note">custody. Green is the unintermediated remainder.</text></svg>