"><circle cx="467.7" cy="243.1" r="4.5" class="pt"/></g><g class="c2"><circle cx="465.8" cy="242.8" r="4.5" class="pt"/></g><g class="c2"><circle cx="473.8" cy="244.1" r="4.5" class="pt"/></g><g class="c2"><circle cx="472.6" cy="243.9" r="4.5" class="pt"/></g><g class="c2"><circle cx="476.5" cy="244.5" r="4.5" class="pt"/></g><g class="c2"><circle cx="492.5" cy="247.1" r="4.5" class="pt"/></g><g class="c2"><circle cx="502.0" cy="248.5" r="4.5" class="pt"/></g><g class="c2"><circle cx="509.1" cy="249.6" r="4.5" class="pt"/></g><g class="c2"><circle cx="500.5" cy="248.3" r="4.5" class="pt"/></g><g class="c2"><circle cx="519.9" cy="251.1" r="4.5" class="pt"/></g><g class="c2"><circle cx="508.4" cy="249.5" r="4.5" class="pt"/></g><g class="c2"><circle cx="509.1" cy="249.6" r="4.5" class="pt"/></g><g class="c2"><circle cx="567.5" cy="257.6" r="4.5" class="pt"/></g><g class="c2"><circle cx="571.0" cy="258.0" r="4.5" class="pt"/></g><g class="c2"><circle cx="579.3" cy="259.0" r="4.5" class="pt"/></g><g class="c2"><circle cx="596.3" cy="261.1" r="4.5" class="pt"/></g><g class="c2"><circle cx="597.0" cy="261.2" r="4.5" class="pt"/></g><g class="c2"><circle cx="604.4" cy="262.0" r="4.5" class="pt"/></g><g class="c2"><circle cx="614.4" cy="263.2" r="4.5" class="pt"/></g><g class="c1"><text x="259.9" y="177.8" class="lab txt" text-anchor="middle">APR(S) = 166.28 / √S</text></g><g class="c2"><text x="567.8" y="289.7" class="lab txt" text-anchor="start">43 observed months, Jan 2023 – Jul 2026</text></g><rect x="550" y="66" width="300" height="76" rx="5" class="box"/><text x="560" y="88" class="monob">log APR = log(166.28) - 0.500 * log S</text><text x="560" y="103" class="mono">fitted slope   -0.5000   (theory -0.5)</text><text x="560" y="118" class="mono">R² = 1.0000   n = 43</text><text x="560" y="133" class="monob">elasticity: +1% stake → -0.5% yield</text><text x="467" y="464" class="axt" text-anchor="middle">ETH staked (millions of ETH)</text><text transform="rotate(-90 20 231.0)" x="20" y="231.0" class="axt" text-anchor="middle">Consensus staking APR (%)</text><text x="84" y="482" class="note">Ethereum pays I(S) = 166.28√S ETH a year, so the yield per staked ETH is I(S)/S = 166.28/√S. Doubling the stake cuts the yield 29.3%; quadrupling it</text><text x="84" y="496" class="note">halves the yield. There is nothing here to estimate — the relationship is protocol arithmetic.</text></svg>