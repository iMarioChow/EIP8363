<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" role="img"><style>
  .s{fill:var(--surface)}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ti{fill:var(--ink);font-size:17px;font-weight:600}
  .sub{fill:var(--ink2);font-size:12.5px}
  .ax{fill:var(--ink2);font-size:11.5px}
  .axt{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .grid{stroke:var(--rule);stroke-width:1}
  .base{stroke:var(--rule2);stroke-width:1.5}
  .lab{font-size:12.5px;font-weight:600}
  .note{fill:var(--ink2);font-size:11px}
  .c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
  .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsh{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .txt{fill:var(--c)}
  .bar{fill:var(--s1)}
  .bar2{fill:var(--s2)} .bar3{fill:var(--s3)}
  .pt{fill:var(--c);fill-opacity:.55;stroke:none}
  .band{fill:var(--c);fill-opacity:.14;stroke:none}
  .fit{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round}
  .zero{stroke:var(--rule2);stroke-width:1.2;stroke-dasharray:4 4}
  .area{fill:var(--c);fill-opacity:.22;stroke:none}
  .box{fill:var(--surface);stroke:var(--rule2);stroke-width:1;rx:5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink2)}
  .monob{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink);font-weight:600}
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--rule:#e7e6e2;--rule2:#c9c8c2;
        --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
  @media (prefers-color-scheme:dark){:root{
        --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--rule:#2e2e2c;--rule2:#4a4a46;
        --s1:#3987e5;--s2:#d95926;--s3:#199e70}}
</style><rect width="880" height="510" class="s"/><text x="84" y="26" class="ti">Stake rate and staking yield are the same variable</text><text x="84" y="45" class="sub">The consensus yield is not correlated with the staked balance — it is a function of it. Every month since 2023 sits exactly on the curve.</text><line x1="84" y1="410.0" x2="850" y2="410.0" class="grid"/><text x="74" y="414.0" class="ax" text-anchor="end">0.0%</text><line x1="84" y1="322.0" x2="850" y2="322.0" class="grid"/><text x="74" y="326.0" class="ax" text-anchor="end">1.5%</text><line x1="84" y1="234.0" x2="850" y2="234.0" class="grid"/><text x="74" y="238.0" class="ax" text-anchor="end">3.0%</text><line x1="84" y1="146.0" x2="850" y2="146.0" class="grid"/><text x="74" y="150.0" class="ax" text-anchor="end">4.5%</text><line x1="84" y1="58.0" x2="850" y2="58.0" class="grid"/><text x="74" y="62.0" class="ax" text-anchor="end">6.0%</text><text x="113.3" y="430.0" class="ax" text-anchor="middle">10M</text><text x="113.3" y="445.0" class="note" text-anchor="middle">8% of supply</text><text x="259.9" y="430.0" class="ax" text-anchor="middle">20M</text><text x="259.9" y="445.0" class="note" text-anchor="middle">17% of supply</text><text x="406.5" y="430.0" class="ax" text-anchor="middle">30M</text><text x="406.5" y="445.0" class="note" text-anchor="middle">25% of supply</text><text x="553.1" y="430.0" class="ax" text-anchor="middle">40M</text><text x="553.1" y="445.0" class="note" text-anchor="middle">33% of supply</text><text x="699.7" y="430.0" class="ax" text-anchor="middle">50M</text><text x="699.7" y="445.0" class="note" text-anchor="middle">41% of supply</text><text x="846.3" y="430.0" class="ax" text-anchor="middle">60M</text><text x="846.3" y="445.0" class="note" text-anchor="middle">50% of supply</text><g class="c1"><path d="M84.0,65.0L87.7,70.3L91.3,75.3L95.0,80.1L98.7,84.7L102.3,89.2L106.0,93.4L109.7,97.5L113.3,101.4L117.0,105.2L120.7,108.9L124.3,112.4L128.0,115.8L131.6,119.1L135.3,122.3L1