<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"><style>
  .s{fill:var(--surface)}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ti{fill:var(--ink);font-size:17px;font-weight:600}
  .sub{fill:var(--ink2);font-size:12.5px}
  .ax{fill:var(--ink2);font-size:11.5px}
  .axt{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .grid{stroke:var(--rule);stroke-width:1}
  .base{stroke:var(--rule2);stroke-width:1.5}
  .lab{font-size:12.5px;font-weight:600}
  .note{fill:var(--ink2);font-size:11px}
  .c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
  .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsh{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .txt{fill:var(--c)}
  .bar{fill:var(--s1)}
  .bar2{fill:var(--s2)} .bar3{fill:var(--s3)}
  .pt{fill:var(--c);fill-opacity:.55;stroke:none}
  .band{fill:var(--c);fill-opacity:.14;stroke:none}
  .fit{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round}
  .zero{stroke:var(--rule2);stroke-width:1.2;stroke-dasharray:4 4}
  .area{fill:var(--c);fill-opacity:.22;stroke:none}
  .box{fill:var(--surface);stroke:var(--rule2);stroke-width:1;rx:5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink2)}
  .monob{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink);font-weight:600}
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--rule:#e7e6e2;--rule2:#c9c8c2;
        --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
  @media (prefers-color-scheme:dark){:root{
        --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--rule:#2e2e2c;--rule2:#4a4a46;
        --s1:#3987e5;--s2:#d95926;--s3:#199e70}}
</style><rect width="880" height="470" class="s"/><text x="84" y="26" class="ti">Almost all of the staking yield is issuance</text><text x="84" y="45" class="sub">Staking APR split into its two sources. Execution-layer income is what survives EIP-8363 untouched — and it is a thin sliver.</text><line x1="84" y1="404.0" x2="850" y2="404.0" class="grid"/><text x="74" y="408.0" class="ax" text-anchor="end">0.0%</text><line x1="84" y1="317.5" x2="850" y2="317.5" class="grid"/><text x="74" y="321.5" class="ax" text-anchor="end">0.9%</text><line x1="84" y1="231.0" x2="850" y2="231.0" class="grid"/><text x="74" y="235.0" class="ax" text-anchor="end">1.8%</text><line x1="84" y1="144.5" x2="850" y2="144.5" class="grid"/><text x="74" y="148.5" class="ax" text-anchor="end">2.7%</text><line x1="84" y1="58.0" x2="850" y2="58.0" class="grid"/><text x="74" y="62.0" class="ax" text-anchor="end">3.6%</text><text x="84.0" y="424.0" class="ax" text-anchor="middle">2024-08</text><text x="217.2" y="424.0" class="ax" text-anchor="middle">2024-12</text><text x="350.4" y="424.0" class="ax" text-anchor="middle">2025-04</text><text x="483.7" y="424.0" class="ax" text-anchor="middle">2025-08</text><text x="616.9" y="424.0" class="ax" text-anchor="middle">2025-12</text><text x="750.1" y="424.0" class="ax" text-anchor="middle">2026-04</text><text x="850.0" y="424.0" class="ax" text-anchor="middle">2026-07</text><g class="c1"><path d="M84.0,404.0L84.0,131.8L117.3,133.1L150.6,134.1L183.9,133.1L217.2,131.4L250.5,130.5L283.8,130.0L317.1,132.2L350.4,131.9L383.7,132.9L417.0,137.1L450.3,139.4L483.7,141.2L517.0,139.1L550.3,143.8L583.6,141.0L616.9,141.2L650.2,154.3L683.5,155.0L716.8,156.7L750.1,160.1L783.4,160.2L816.7,161.6L850.0,163.5L850.0,404.0Z" class="area"/><path d="M84.0,131.8L117.3,133.1L150.6,134.1L183.9,133.1L217.2,131.4L250.5,130.5L283.8,130.0L317.1,132.2L350.4,131.9L383.7,132.9L417.0,137.1L450.3,139.4L483.7,141.2L517.0,139.1L550.3,143.8L583.6,141.0L616.9,141.2L650.2,154.3L683.5,155.0L716.8,15