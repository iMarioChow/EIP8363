<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img"><style>
  .s{fill:var(--surface)}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ti{fill:var(--ink);font-size:17px;font-weight:600}
  .sub{fill:var(--ink2);font-size:12.5px}
  .ax{fill:var(--ink2);font-size:11.5px}
  .axt{fill:var(--ink2);font-size:11.5px;font-weight:600}
  .grid{stroke:var(--rule);stroke-width:1}
  .base{stroke:var(--rule2);stroke-width:1.5}
  .lab{font-size:12.5px;font-weight:600}
  .note{fill:var(--ink2);font-size:11px}
  .c1{--c:var(--s1)} .c2{--c:var(--s2)} .c3{--c:var(--s3)}
  .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsh{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .txt{fill:var(--c)}
  .bar{fill:var(--s1)}
  .bar2{fill:var(--s2)} .bar3{fill:var(--s3)}
  .pt{fill:var(--c);fill-opacity:.55;stroke:none}
  .band{fill:var(--c);fill-opacity:.14;stroke:none}
  .fit{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round}
  .zero{stroke:var(--rule2);stroke-width:1.2;stroke-dasharray:4 4}
  .area{fill:var(--c);fill-opacity:.22;stroke:none}
  .box{fill:var(--surface);stroke:var(--rule2);stroke-width:1;rx:5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink2)}
  .monob{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11px;fill:var(--ink);font-weight:600}
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--rule:#e7e6e2;--rule2:#c9c8c2;
        --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
  @media (prefers-color-scheme:dark){:root{
        --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--rule:#2e2e2c;--rule2:#4a4a46;
        --s1:#3987e5;--s2:#d95926;--s3:#199e70}}
</style><rect width="880" height="500" class="s"/><text x="84" y="26" class="ti">The correlation people quote is a trend, not a relationship</text><text x="84" y="45" class="sub">Left: the naive regression on levels, which looks strong and is spurious. Right: the same question asked in monthly changes, which is the version that identifies anything.</text><text x="84" y="66" class="sub">Each dot is one month, Jan 2023 - Jul 2026. Shaded band is the 95% confidence interval of the fitted line.</text><text x="84" y="82" class="lab" fill="var(--ink)">LEVELS  —  do not publish</text><line x1="84" y1="349.8" x2="420" y2="349.8" class="grid"/><text x="74" y="353.8" class="ax" text-anchor="end">0.030</text><line x1="84" y1="289.4" x2="420" y2="289.4" class="grid"/><text x="74" y="293.4" class="ax" text-anchor="end">0.040</text><line x1="84" y1="228.9" x2="420" y2="228.9" class="grid"/><text x="74" y="232.9" class="ax" text-anchor="end">0.050</text><line x1="84" y1="168.5" x2="420" y2="168.5" class="grid"/><text x="74" y="172.5" class="ax" text-anchor="end">0.060</text><line x1="84" y1="108.1" x2="420" y2="108.1" class="grid"/><text x="74" y="112.1" class="ax" text-anchor="end">0.070</text><text x="103.8" y="400.0" class="ax" text-anchor="middle">2.5%</text><text x="202.6" y="400.0" class="ax" text-anchor="middle">3.0%</text><text x="301.4" y="400.0" class="ax" text-anchor="middle">3.5%</text><text x="400.2" y="400.0" class="ax" text-anchor="middle">4.0%</text><clipPath id="clip84"><rect x="84" y="96" width="336" height="284"/></clipPath><g class="c1" clip-path="url(#clip84)"><path d="M84.0,353.3L89.6,348.5L95.2,343.8L100.8,339.0L106.4,334.2L112.0,329.4L117.6,324.5L123.2,319.6L128.8,314.7L134.4,309.8L140.0,304.8L145.6,299.7L151.2,294.7L156.8,289.5L162.4,284.3L168.0,279.0L173.6,273.7L179.2,268.2L184.8,262.7L190.4,257.1L196.0,251.4L201.6,245.6L207.2,239.7L212.8,233.7L218.4,227.7L224.0,221.6L229.6,215.4L235.2,209.1L240.8,202.7L246.4,196.4L252.0,189.9L257.6,183.4L263.2,176.9L268.