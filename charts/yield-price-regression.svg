lass="pt"/><circle cx="706.4" cy="249.2" r="4" class="pt"/><circle cx="621.6" cy="268.2" r="4" class="pt"/><circle cx="714.3" cy="303.9" r="4" class="pt"/><circle cx="677.7" cy="240.2" r="4" class="pt"/><circle cx="516.4" cy="265.6" r="4" class="pt"/><circle cx="671.1" cy="326.1" r="4" class="pt"/><circle cx="658.8" cy="223.2" r="4" class="pt"/><circle cx="638.1" cy="203.0" r="4" class="pt"/><circle cx="678.2" cy="269.8" r="4" class="pt"/><circle cx="662.4" cy="300.9" r="4" class="pt"/><circle cx="656.5" cy="178.7" r="4" class="pt"/></g><text x="680" y="422" class="axt" text-anchor="middle">Change in staking APR (basis points)</text><text transform="rotate(-90 450 238.0)" x="450" y="238.0" class="axt" text-anchor="middle">ETH monthly return (%)</text><rect x="520" y="104" width="214" height="76" rx="5" class="box"/><text x="530" y="126" class="monob">R² = 0.003   r = -0.055</text><text x="530" y="141" class="mono">slope -0.18 pp per bp</text><text x="530" y="156" class="mono">95% CI [-1.23, +0.87]</text><text x="530" y="171" class="monob">p = 0.73  → zero</text><text x="84" y="444" class="note">Durbin-Watson near zero means the level regression's residuals are almost perfectly autocorrelated: it has fitted a shared downtrend, not a</text><text x="84" y="458" class="note">relationship. In changes the slope is a third of its own standard error and the 95% interval straddles zero. APR = 166.28/√S is a deterministic</text><text x="84" y="472" class="note">function of the staked balance, so the level series is near-monotone and carries almost no independent variation to regress against.</text></svg>